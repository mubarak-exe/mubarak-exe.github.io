<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mubarak Shikalgar</title>
<script>
  // Pages live at #routes (for example /#work), so send /work to /#work.
  var p = location.pathname.replace(/^\/+|\/+$/g, "").replace(/\.html?$/, "");
  location.replace("/" + (location.hash || (p ? "#" + p : "")));
</script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px;">
<p>Page not found. <a href="/">Go to the home page</a>.</p>
</body>
</html>
